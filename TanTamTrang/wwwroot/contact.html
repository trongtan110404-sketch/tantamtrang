  <main class="page-shell">
    
    <h1 class="page-title">Contact</h1>

    <!-- Two columns: who to reach and how on the left, the form on the right;
         stacked on a phone. -->
    <section class="ct-grid">
      <div class="ct-info">
        <p class="ct-lead">Have a project, a collaboration or just an idea? Write to me &mdash; I read every message.</p>

        <div class="ct-block">
          <div class="contact-label">EMAIL</div>
          <div class="ct-email">
            <a class="ct-email-link" href="mailto:trongtan110404@gmail.com">trongtan110404@gmail.com</a>
            <button class="ct-copy" type="button" data-copy="trongtan110404@gmail.com">COPY</button>
          </div>
        </div>

        <div class="ct-block">
          <div class="contact-label">SOCIAL</div>
          <ul class="ct-social">
            <li><a href="https://www.instagram.com/tantamtrang/" target="_blank" rel="noopener noreferrer"><span>Instagram</span><span class="ct-handle">@tantamtrang</span><span class="ct-arrow" aria-hidden="true">↗</span></a></li>
            <li><a href="https://www.facebook.com/tan.ao.102250/" target="_blank" rel="noopener noreferrer"><span>Facebook</span><span class="ct-handle">TanDao</span><span class="ct-arrow" aria-hidden="true">↗</span></a></li>
          </ul>
        </div>

      
      </div>

      <div class="ct-form-panel">
        <div class="contact-label">SEND A MESSAGE</div>
        <form class="contact-form" action="https://formsubmit.co/trongtan110404@gmail.com" method="POST">
          <div class="form-row">
            <input type="text" name="name" class="form-input" placeholder="Name" autocomplete="name" required>
            <input type="email" name="email" class="form-input" placeholder="Email" autocomplete="email" required>
          </div>
          <textarea name="message" class="form-input form-textarea" placeholder="Message" required></textarea>
          <button type="submit" class="form-submit">Send Message</button>
        </form>
      </div>
    </section>
