<body class="hp">

  <!-- Home is laid out as a typographic poster: a header of four columns,
       a line of notes, the statement in very large type stepping from left
       to right, and a footer row. Styles are in home.css only. -->
  <!-- Background: images/transition-06.png under a dark veil, with film
       grain on top (body::before / body::after in home.css). -->

  <div class="pt-page">
    <header class="pt-row pt-top">
      <a class="pt-logo" href="index.html" aria-label="TanTamTrang home">TanTamTrang</a>
    
      
      <nav class="pt-nav" aria-label="Main">
        <a href="about.html">About</a>
        <a href="works.html">Works</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <section class="pt-row pt-notes">
      <p class="pt-quote">I create research-driven visual experiences across 3D and experience design that challenge perspectives and leave lasting impressions.<br></p>
      
      <span class="pt-label">Visual<br>Designer</span>
    </section>

    <main class="pt-type">
      <div class="pt-stage">
        <h1 class="pt-statement">
          <span class="pt-l pt-left">Welcome</span>
          <span class="pt-l pt-left">to</span>
          <span class="pt-l pt-right">my</span>
          <span class="pt-l pt-right">world.</span>
        </h1>
      </div>
      <!-- From images/about-user-01 (1).png, resized for the web. It fills the
           right-hand column between the two rules. -->
      <figure class="pt-photo">
        <img src="images/home/home-photo.jpg" width="1200" height="800" alt="Dao Trong Tan holding a camera" decoding="async">
      </figure>
    </main>

    <footer class="pt-row pt-foot">
     
    </footer>
  </div>

  <script>
    // Fade out before following a link to another page of the site
    // (the same rule as script.js on the other pages).
    (function () {
      var leaving = false;
      document.addEventListener('click', function (e) {
        var link = e.target.closest && e.target.closest('a[href]');
        if (!link || leaving) return;
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (link.target === '_blank' || link.hasAttribute('download')) return;
        var url = new URL(link.href, location.href);
        if (url.origin !== location.origin || !/\.html$|\/$/.test(url.pathname)) return;
        if (url.pathname === location.pathname) return;
        e.preventDefault();
        leaving = true;
        document.documentElement.classList.add('pf-leave');
        setTimeout(function () { location.href = url.href; }, 300);
      });
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        leaving = false;
        document.documentElement.classList.remove('pf-leave');
      });
    })();
  </script>
</body>
